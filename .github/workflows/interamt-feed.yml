name: INTERAMT IT NRW Feed

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/interamt-feed.yml'
      - 'scripts/**'
      - 'test/**'
      - 'data/**'
      - 'package.json'
      - 'package-lock.json'
  schedule:
    # 06:45 Berlin in winter, 07:45 in summer.
    - cron: '45 5 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: interamt-feed
  cancel-in-progress: false

jobs:
  update-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
      - name: Node installieren
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Feed-Tests ausführen
        run: npm test
      - name: Chromium installieren
        run: npx playwright install chromium --with-deps
      - name: INTERAMT durchsuchen und Feeds erstellen
        env:
          FEED_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: npm run update-feed
      - name: RSS als XML prüfen
        run: |
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          with open('feed.json') as f:
              feed = json.load(f)
          rss = ET.parse('feed.xml').getroot()
          assert rss.tag == 'rss' and rss.attrib['version'] == '2.0'
          assert len(rss.findall('./channel/item')) == len(feed['jobs'])
          PY
      - name: Feeds ins Repository schreiben
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.json feed.md feed.xml
          if ! git diff --cached --quiet; then
            git commit -m "Update INTERAMT IT NRW feeds"
            git push
          fi
      - name: Pages-Dateien vorbereiten
        run: |
          mkdir -p _site
          cp feed.json feed.md feed.xml _site/
          touch _site/.nojekyll
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="de">
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>INTERAMT – IT-Stellen in NRW</title>
          <link rel="alternate" type="application/rss+xml" title="IT-Stellen in NRW" href="feed.xml">
          <h1>INTERAMT – IT-Stellen in Nordrhein-Westfalen</h1>
          <p>Täglich aktualisierte IT-Stellen für Beamte und Tarifbeschäftigte in NRW.</p>
          <ul>
          <li><a href="feed.xml">RSS-Feed abonnieren</a></li>
          <li><a href="feed.md">Stellenübersicht (Markdown)</a></li>
          <li><a href="feed.json">JSON-Feed</a></li>
          </ul>
          <p>Quelle: <a href="https://www.interamt.de/koop/app/stellensuche">INTERAMT</a>.</p>
          </html>
          HTML
      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Pages hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
